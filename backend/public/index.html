<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>@import url('https://fonts.googleapis.com/css2?family=Average+Sans&family=Cantarell:ital,wght@0,400;0,700;1,400;1,700&family=Hachi+Maru+Pop&family=Noto+Sans+JP:wght@100..900&display=swap');</style>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="mobile.css">
    <title>inkBudget</title>
</head>
<body>
    <div class="header">
        <h1>CC</h1> 
        <h2>inkBudget()</h2>
        <p>Orçamento virtual</p>
    </div>

    <main>
        <form id="formularioOrcamento" class="formulario">
            <fieldset>
                <legend>Tamanho</legend>
                <label for="tamanho">Tamanho aproximado (cm)</label>
                <input type="number" name="tamanho" id="tamanho" placeholder="Ex: 50">
            </fieldset>

            <fieldset>
                <legend>Estilo</legend>
                <label for="estilo">Selecione o estilo da tatuagem</label>
                <select name="estilo" id="estilo">
                    <option value="realista">Realista</option>
                    <option value="blackwork">Blackwork</option>
                    <option value="oriental">Oriental</option>
                </select>
            </fieldset>


            <fieldset>
                <legend>Cores</legend>

                <input type="radio" name="cores" id="cores1" value="preto e branco"> 
                <label for="cores1">Preto e Branco</label>

                <input type="radio" name="cores" id="cores2" value="colorida">
                <label for="cores2">Colorida</label>
            </fieldset>


            <fieldset>
                <legend>Região do corpo</legend>
                 <label for="regiaoCorpo">Região do corpo</label>
                <select name="regiao" id="regiaoCorpo">
                    <option value="cabeca">Cabeça</option>
                    <option value="rosto">Rosto</option>
                    <option value="pescoco">Pescoço</option>
                    <option value="torax">Tórax</option>
                    <option value="braco">Braço</option>
                    <option value="antebraco">Antebraço</option>
                    <option value="mao">Mão</option>
                    <option value="barriga">Barriga</option>
                    <option value="coxa">Coxa</option>
                    <option value="canela">Canela</option>
                    <option value="costas">Costas</option>
                    <option value="gluteos">Glúteos</option>
                    
                </select>
            </fieldset>

             <fieldset>
                <legend>Detalhes</legend>
                <label for="detalhes">Quantidade de detalhes</label>
                <select name="detalhes" id="detalhes">
                    <option value="pouco">Pouco</option>
                    <option value="medio">Médio</option>
                    <option value="muito">Muito</option>
                </select>
            </fieldset>



<fieldset>
    <legend>Seus dados</legend>

    <label for="nome">Nome</label>
    <input type="text" name="nome" id="nome" placeholder="Seu nome" maxlength="60" autocomplete="name">

    <label for="telefone">WhatsApp</label>
    <input type="tel" name="telefone" id="telefone" placeholder="(27) 99999-9999" maxlength="15" autocomplete="tel">
</fieldset>

<button type="submit">Calcular orçamento</button>

<div class="resultado" id="resultado">
    <p id="textoResultado"></p>
    <a id="linkWhatsapp" class="botao-whatsapp" href="#" target="_blank" rel="noopener" hidden>
        Enviar para o estúdio no WhatsApp
    </a>
</div>
        </form>

        
    </main>


    <script src="script.js"></script>
</body>
</html>
